document_status: Accepted
date: 2026-05-24
responsible: JusNova Architecture
related_decision: ADR-011
provider_registry:
  version: provider-registry-v0.10.0
  providers:
    - provider_name: openai_model_provider
      provider_family: ModelProvider
      feature_flag: provider.openai_model.enabled
      kill_switch: provider.openai_model.kill_switch
      timeout_ms: 30000
      retry_policy:
        max_attempts: 1
        backoff: exponential
        retry_on:
          - timeout
          - rate_limited
          - provider_error
      error_mapping:
        timeout: timeout
        rate_limited: rate_limited
        provider_error: provider_error
        cancelled: cancelled_by_system
      cost_tracking: true
      data_received_classes:
        - PUBLIC_LEGAL_SOURCE
        - PUBLIC_LEGAL_QUERY
        - DERIVED_LEGAL_QUERY_RESTRICTED
        - USER_MESSAGE_CONFIDENTIAL
        - CASE_MEMORY_CONFIDENTIAL
        - DOCUMENT_EVIDENCE_CONFIDENTIAL
      data_returned_classes:
        - DERIVED_LEGAL_QUERY_RESTRICTED
        - USER_MESSAGE_CONFIDENTIAL
        - CASE_MEMORY_CONFIDENTIAL
        - DOCUMENT_EVIDENCE_CONFIDENTIAL
        - PROVIDER_OPERATIONAL_METADATA
      stores_customer_data: false
      training_use_allowed: false
      region_or_residency: configured_by_deployment
      subprocessors: []
      operational_logs:
        stores_payload: false
        stores_hashes: true
        retention_class: operational
